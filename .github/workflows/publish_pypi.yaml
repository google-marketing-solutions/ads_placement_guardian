name: Publish to PyPI & Create Tag

on:
  push:
    branches:
      - main  # Or your release branch
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Get versions and check for change
        id: version_check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PREV_VERSION=$(git show HEAD~1:backend/ads_placement_guardian/__init__.py | grep -oE "__version__ = '([0-9]+\.[0-9]+\.[0-9]+)'" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          CURRENT_VERSION=$(grep -oE "__version__ = '([0-9]+\.[0-9]+\.[0-9]+)'" backend/ads_placement_guardian/__init__.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          PYPI_STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/ads-placement-guardian/${CURRENT_VERSION}/json" || echo "000")

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$CURRENT_VERSION" != "$PREV_VERSION" || "$PYPI_STATUS" == "404" ]]; then
            echo "Publishing version $CURRENT_VERSION (prev=$PREV_VERSION, event=$EVENT_NAME, pypi_http=$PYPI_STATUS)"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No version change and $CURRENT_VERSION already on PyPI (http=$PYPI_STATUS). Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.version_check.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          NG_CLI_ANALYTICS: ci
        run: npm install --no-audit

      - name: Build frontend
        working-directory: ./frontend
        if: steps.version_check.outputs.should_publish == 'true'
        env:
          NG_CLI_ANALYTICS: ci
        run: |
          npm run build
          mkdir -p ../backend/ads_placement_guardian/static/img
          cp ../backend/ads_placement_guardian/img/gtechlogo.png ../backend/ads_placement_guardian/static/img/gtechlogo.png

      - name: Build the package
        working-directory: ./backend
        if: steps.version_check.outputs.should_publish == 'true'
        run: uv build

      - name: Publish to PyPI
        working-directory: ./backend
        if: steps.version_check.outputs.should_publish == 'true'
        run: uv publish dist/*
